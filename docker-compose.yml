services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: videodb
      MYSQL_USER: ${MYSQL_USER}           # app user, gets access to videodb only
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql         # data survives container recreation
    networks: [backend]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  auth:
    build: ./auth
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/videodb
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3001:3000"   # testing only, removed at the end
    networks: [backend]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }

  storage:
    build: ./storage
    environment:
      AUTH_URL: http://auth:3000
    volumes:
      - videos_data:/data/videos          # videos survive container recreation
    depends_on:
      auth:
        condition: service_healthy
    ports:
      - "3002:3000"   # testing only, removed at the end
    networks: [backend]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }

  video_upload:
    build: ./video_upload
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/videodb
      AUTH_URL: http://auth:3000
      STORAGE_URL: http://storage:3000
    depends_on:
      auth:
        condition: service_healthy    # auth creates the tables, so wait for it
      storage:
        condition: service_healthy
    ports:
      - "8080:3000"   # the upload web app, open http://localhost:8080
    networks: [frontend, backend]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }
  video-streaming:
    build: ./video_streaming
    environment:
      MYSQL_CONNECTOR_STRING: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/videodb
      DATABASE_HOST: mysql
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      DATABASE_SCHEMA: videodb
      AUTH_URL: http://auth:3000
      STORAGE_URL: http://storage:3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 30s
      retries: 5
    depends_on:
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
    ports:
      - 8081:3000
    networks: 
      - frontend
      - backend
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }
networks:
  frontend:
  backend:

volumes:
  mysql_data:
  videos_data: