services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: videodb
      MYSQL_USER: ${MYSQL_USER}           # app user, gets access to videodb only
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql         # data survives container recreation
    networks: [backend]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  auth:
    build: ./auth
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/videodb
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3001:3000"   # only so we can test with curl for now; removed once the web apps exist
    networks: [backend]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }

networks:
  backend:

volumes:
  mysql_data: